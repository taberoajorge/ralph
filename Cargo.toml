[package]
name = "ralph"
version = "0.1.0"
edition = "2021"
description = "Autonomous AI agent loop for keeping feature branches up-to-date"
license = "MIT"
repository = "https://github.com/taberoajorge/ralph"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
